{% extends "base.html" %}

{% block title %}Upload dataset{% endblock %}

{% block content %}
<h1 class="h3 mb-3">Upload a dataset</h1>
<form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label" for="{{ form.name.id_for_label }}">Dataset name</label>
        {{ form.name }}
        <div class="form-text">Leave blank to use the file name.</div>
    </div>
    <div class="mb-3">
        <label class="form-label" for="{{ form.file.id_for_label }}">File (.csv or .xlsx)</label>
        {{ form.file }}
        {% for error in form.file.errors %}
            <div class="text-danger small mt-1">{{ error }}</div>
        {% endfor %}
    </div>
    <button type="submit" class="btn btn-primary">Upload</button>
    <a href="{% url 'archive:dashboard' %}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
