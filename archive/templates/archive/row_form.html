{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="sona-page-header">
    <div class="sona-eyebrow">{{ dataset.name }}</div>
    <h1 class="h3 mb-0">{{ title }}</h1>
</div>

<div class="sona-card sona-card-body" style="max-width: 560px;">
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}
                <div class="text-danger small mt-1">{{ error }}</div>
            {% endfor %}
        </div>
        {% endfor %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a href="{% url 'archive:dataset_detail' dataset.pk %}" class="btn btn-outline-secondary">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
